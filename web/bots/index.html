<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="same-origin">
<meta name="color-scheme" content="light dark">
<title>Team Bot · AI workspace</title>
<script>
// Apply the saved theme before first paint so there is no flash. js/theme.js takes over after load.
(function () {
  var p = 'system';
  try { p = localStorage.getItem('teamBot.theme') || 'system'; } catch (e) { /* storage blocked */ }
  if (p !== 'light' && p !== 'dark') p = 'system';
  var dark = p === 'dark' || (p === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme-pref', p);
})();
</script>
<link rel="stylesheet" href="/bots/bots.css">
<link rel="stylesheet" href="/bots/config.css">
<link rel="stylesheet" href="/bots/layout.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="shell" id="shell">
  <nav class="side" id="side" aria-label="AI workspace">
    <div class="side-head">
      <a class="brand" href="#/hq" aria-label="Team Bot, Headquarters">
        <svg class="brand-mark" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true" focusable="false">
          <path d="M16 2 28 9v14L16 30 4 23V9z" fill="#4F46E5"/>
          <path d="M16 2 28 9 16 16 4 9z" fill="#818CF8"/>
          <path d="M16 16v14L4 23V9z" fill="#3730A3"/>
          <rect x="11" y="11" width="10" height="8" rx="2.5" fill="#fff" opacity=".95"/>
          <circle cx="14.2" cy="15" r="1.2" fill="#3730A3"/><circle cx="17.8" cy="15" r="1.2" fill="#3730A3"/>
        </svg>
        <span>Team Bot</span>
      </a>
      <button class="icon-btn side-close" id="sideClose" type="button" aria-label="Close menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <ul class="nav" id="navMain"></ul>
    <div class="nav-foot">
      <ul class="nav" id="navFoot"></ul>
      <a class="human-link" href="/">Human team HQ</a>
    </div>
  </nav>
  <div class="scrim" id="scrim" hidden></div>

  <div class="main">
    <header class="top">
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="side">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <nav class="crumbs" aria-label="Breadcrumb"><ol><li><a href="#/overview">My workspace</a></li><li aria-current="page" id="crumb">Headquarters</li></ol></nav>
      <div class="top-right">
        <div class="search" id="search">
          <label class="sr-only" for="searchInput">Search tasks, lessons and bots</label>
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
          <input id="searchInput" type="search" placeholder="Search tasks, lessons or bots…" autocomplete="off" aria-controls="searchResults" aria-expanded="false">
          <div class="search-results" id="searchResults" hidden></div>
        </div>
        <a class="demo-chip" id="demoChip" href="#/settings" hidden>Demo data</a>
        <button class="icon-btn theme-toggle" id="themeToggle" type="button" aria-pressed="false" title="Dark theme">
          <span class="sr-only">Dark theme</span>
          <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        </button>
        <span class="avatar" id="avatar" role="img" aria-label="Owner">··</span>
      </div>
    </header>
    <div class="demo-banner" id="demoBanner" role="region" aria-label="Demo data notice" hidden></div>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/bots/js/app.js"></script>
</body>
</html>
